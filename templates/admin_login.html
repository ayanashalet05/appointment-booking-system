
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f5fb;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 {
            text-align: center;
            color: #5145cd;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d5e2;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #5145cd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            background: #ffe8e8;
            color: #a52222;
            padding: 10px;
            border-radius: 6px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5145cd;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Admin Login</h1>
        <p>Sign in to manage appointments.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/admin/login" method="POST">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <a href="/">Back to Booking Page</a>
    </div>
</body>
</html>
