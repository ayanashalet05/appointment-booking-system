
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 24px; }
        .box { max-width: 440px; margin: 35px auto; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 15px #0001; }
        h1 { color: #4338ca; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 11px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #4338ca; color: white; border: 0; border-radius: 6px; cursor: pointer; }
        .message { padding: 10px; background: #fee2e2; border-radius: 6px; margin: 10px 0; }
        .success { background: #dcfce7; }
        p { text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <h1>Create Account</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <label for="full_name">Full Name</label>
        <input id="full_name" type="text" name="full_name"
               maxlength="100" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" name="email"
               maxlength="150" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password"
               minlength="8" autocomplete="new-password" required>

        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password"
               minlength="8" autocomplete="new-password" required>

        <button type="submit">Register</button>
    </form>

    <p>Already registered? <a href="{{ url_for('patient_login') }}">Login</a></p>
    <p><a href="{{ url_for('home') }}">Back to Home</a></p>
</div>
</body>
</html>
